# Supabase 무료 플랜은 일주일 정도 활동이 없으면 프로젝트가 휴면(pause)되어
# 앱에서 "서버 연결에 실패했습니다"가 뜹니다. 매일 한 번 가볍게 조회해 휴면을 막습니다.
name: Supabase keep-alive

on:
  schedule:
    - cron: "17 1 * * *"   # 매일 10:17 KST
  workflow_dispatch: {}
  push:
    branches: [claude/restore-connection-rknp31]   # 동작 확인용 임시 트리거

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          curl -fsS --max-time 30 \
            "https://lqdgoqlkfckifqyjhnon.supabase.co/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: sb_publishable_MV6Ph9WOrv0nzVIvseXlLw_O5WhfQPv" > /dev/null
          echo "Supabase ping OK"
