<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리버스 전자결재</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#2b5df0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 로그인 화면 -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-box">
    <div class="login-logo">RE:VERSE</div>
    <h1>주식회사 리버스 전자결재</h1>
    <p class="login-desc">사용자를 선택하고 비밀번호를 입력하세요.</p>
    <div id="login-users" class="login-users"></div>
    <form id="login-form" class="login-form hidden" onsubmit="return doLogin(event)">
      <div class="login-selected" id="login-selected"></div>
      <input type="password" id="login-pw" placeholder="비밀번호" autocomplete="current-password">
      <button type="submit" class="btn" style="width:100%">로그인</button>
      <button type="button" class="btn secondary" style="width:100%" onclick="resetLoginForm()">다른 사용자 선택</button>
    </form>
    <p class="login-note" id="login-error"></p>
    <p class="login-note">※ 모든 직원이 같은 데이터를 실시간으로 공유합니다.</p>
  </div>
</div>

<!-- 메인 레이아웃 -->
<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-mark">RE:VERSE</span>
      <span class="logo-sub">전자결재</span>
    </div>
    <nav class="nav" id="nav">
      <a href="#/dashboard" data-route="dashboard" class="nav-item"><span class="nav-ico">🏠</span>대시보드</a>
      <a href="#/new" data-route="new" class="nav-item"><span class="nav-ico">✏️</span>지출결의서 작성</a>
      <a href="#/inbox" data-route="inbox" class="nav-item"><span class="nav-ico">📥</span>결재 대기함 <span id="badge-inbox" class="badge hidden">0</span></a>
      <a href="#/drafts" data-route="drafts" class="nav-item"><span class="nav-ico">📤</span>내 기안함</a>
      <a href="#/docs" data-route="docs" class="nav-item"><span class="nav-ico">📚</span>전체 문서함</a>
      <div class="nav-label">판매 관리 (ERP)</div>
      <a href="#/sales" data-route="sales" class="nav-item"><span class="nav-ico">📊</span>매출 입력·조회</a>
      <a href="#/purchases" data-route="purchases" class="nav-item"><span class="nav-ico">🧾</span>매입 입력·조회</a>
      <a href="#/inventory" data-route="inventory" class="nav-item"><span class="nav-ico">📦</span>재고 현황</a>
      <a href="#/products" data-route="products" class="nav-item"><span class="nav-ico">🏷️</span>제품 마스터</a>
      <div class="nav-label">시스템</div>
      <a href="#/settings" data-route="settings" class="nav-item"><span class="nav-ico">⚙️</span>설정 · 알림</a>
    </nav>
    <div class="sidebar-user">
      <div class="avatar" id="user-avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="user-name">-</div>
        <div class="user-role" id="user-role">-</div>
      </div>
      <button class="btn-ghost" id="btn-logout" title="로그아웃">↩</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn-ghost menu-toggle" id="menu-toggle">☰</button>
      <div class="topbar-title" id="page-title">대시보드</div>
      <div class="topbar-user" id="topbar-user"></div>
    </header>
    <main class="content" id="content"></main>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
