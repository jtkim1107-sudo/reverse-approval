<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>리버스 전자결재</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="theme-color" content="#4f5df0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/style.css?v=78">
</head>
<body>

<!-- 로그인 화면 -->
<div id="login-screen" class="login-screen hidden">
  <div class="login-box">
    <div class="login-logo">RE:VERSE</div>
    <h1>주식회사 리버스 전자결재</h1>
    <p class="login-desc">사용자를 선택하고 비밀번호를 입력하세요.</p>
    <div id="login-users" class="login-users"></div>
    <form id="login-form" class="login-form hidden" onsubmit="return doLogin(event)">
      <div class="login-selected" id="login-selected"></div>
      <input type="password" id="login-pw" placeholder="비밀번호" autocomplete="current-password">
      <button type="submit" class="btn" style="width:100%">로그인</button>
      <button type="button" class="btn secondary" style="width:100%" onclick="resetLoginForm()">다른 사용자 선택</button>
    </form>
    <p class="login-note" id="login-error"></p>
    <p class="login-note">※ 모든 직원이 같은 데이터를 실시간으로 공유합니다.</p>
  </div>
</div>

<!-- 메인 레이아웃 -->
<div id="app" class="app hidden">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-logo">
      <span class="logo-mark">RE:VERSE</span>
      <span class="logo-sub">전자결재</span>
    </div>
    <nav class="nav" id="nav">
      <!-- 영역별 대표 메뉴만 두고, 세부 기능은 각 화면 상단 탭에서 전환합니다. -->
      <a href="#/dashboard" data-route="dashboard" class="nav-item"><span class="nav-ico">🏠</span>첫 화면</a>

      <div class="nav-label">핵심 업무</div>
      <a href="#/sales" data-route="sales" data-area="sales" class="nav-item"><span class="nav-ico">📊</span>매출 · 고객 <span id="badge-voc" class="badge hidden">0</span></a>
      <a href="#/po" data-route="po" data-area="purchase" class="nav-item"><span class="nav-ico">📦</span>매입 · 상품 <span id="badge-po" class="badge hidden">0</span></a>
      <a href="#/stockflow/stock" data-route="stockflow" data-tab="stock" data-area="inventory" class="nav-item"><span class="nav-ico">🏷️</span>재고 · 발주</a>
      <a href="#/cash" data-route="cash" data-area="finance" class="nav-item"><span class="nav-ico">💰</span>자금 · 결재 <span id="badge-inbox" class="badge hidden">0</span></a>
      <a href="#/stockflow/rginbound" data-route="stockflow" data-tab="rginbound" data-area="inbound" class="nav-item"><span class="nav-ico">🚛</span>자동 입고 <span id="badge-rginbound" class="badge hidden">0</span></a>
      <a href="#/briefing" data-route="briefing" data-area="reports" class="nav-item"><span class="nav-ico">📰</span>보고 · 결산</a>
      <a href="#/ads" data-route="ads" data-area="ads" class="nav-item"><span class="nav-ico">📣</span>광고</a>

      <div class="nav-label">업무 · 설정</div>
      <a href="#/tasks" data-route="tasks" data-area="work" class="nav-item"><span class="nav-ico">✅</span>업무 · 일정 <span id="badge-tasks" class="badge hidden">0</span></a>
      <a href="#/settings" data-route="settings" data-area="settings" class="nav-item"><span class="nav-ico">⚙️</span>운영 설정</a>

      <!-- 승인 권한자에게만 보이는 복구 도구. 업무 메뉴와 분리해 기본 화면을 단순하게 유지합니다. -->
      <div class="nav-label nav-admin nav-admin-label hidden">🔧 시스템 · 관리자 도구</div>
      <a href="#/restockrecovery" data-route="restockrecovery" class="nav-item nav-admin hidden"><span class="nav-ico">🔁</span>재입고 WING 복구</a>
      <a href="#/restockinquiryclose" data-route="restockinquiryclose" class="nav-item nav-admin hidden"><span class="nav-ico">🧹</span>재입고 문의 테스트 종료</a>
      <a href="#/wingreceiptfix" data-route="wingreceiptfix" class="nav-item nav-admin hidden"><span class="nav-ico">🧮</span>WING 직접입고 최종수량 정정</a>
    </nav>
    <div class="sidebar-user">
      <div class="avatar" id="user-avatar">?</div>
      <div class="user-info">
        <div class="user-name" id="user-name">-</div>
        <div class="user-role" id="user-role">-</div>
      </div>
      <button class="btn-ghost" id="btn-logout" title="로그아웃">↩</button>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="btn-ghost menu-toggle" id="menu-toggle">☰</button>
      <div class="topbar-title" id="page-title">대시보드</div>
      <button class="btn sm secondary" onclick="openFeedback()" title="개선 요청·반복업무 신고를 대표에게 바로 전달" style="margin-right:10px">💬 개선 요청</button>
      <div class="topbar-user" id="topbar-user"></div>
    </header>
    <main class="content" id="content"></main>
    <!-- 2026-10-01 [사용자 지시] 공통 운영 상태·WING 로그인 경고는 각 화면 주요 내용이 끝난 뒤 맨 아래(PC·모바일) -->
    <div id="wing-session-banner" hidden></div>
  </div>
</div>

<div id="modal-root"></div>
<div id="toast" class="toast hidden"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
<script src="js/erp_ui.js?v=5"></script>
<script src="js/erp_dashboard.js?v=10"></script>
<script src="js/sales_monthly_summary.js?v=4"></script>
<script src="js/sales_refresh.js?v=7"></script>
<script src="js/live_sales.js?v=5"></script>
<script src="js/ad_costs.js?v=4"></script>
<script src="js/cs_inquiries.js?v=2"></script>
<script src="js/coupang_centers.js?v=2"></script>
<script src="js/inbound_approval.js?v=8"></script>
<script src="js/inbound_freight.js?v=3"></script>
<script src="js/procurement_input.js?v=7"></script>
<script src="js/restock_wing_recovery.js?v=1"></script>
<script src="js/restock_candidate_approval.js?v=1"></script>
<script src="js/restock_inquiry_close.js?v=1"></script>
<script src="js/supplier_mail_approval.js?v=2"></script>
<script src="js/wing_direct_receipt_fix.js?v=2"></script>
<script src="js/resale_return.js?v=1"></script>
<script src="js/inventory_display.js?v=2"></script>
<script src="js/cm_settlement.js?v=14"></script>
<script src="js/cm_simple.js?v=3"></script>
<script src="js/toss_settlement.js?v=3"></script>
<script src="js/cm_recovery.js?v=2"></script>
<script src="js/ad_product_profit.js?v=3"></script>
<script src="js/bank_statement_upload.js?v=1"></script>
<script src="js/erp_home.js?v=5"></script>
<script src="js/ad_status_view.js?v=1"></script>
<script src="js/app.js?v=168"></script>
<script src="js/sales_statistics_panel.js?v=4"></script>
</body>
</html>
